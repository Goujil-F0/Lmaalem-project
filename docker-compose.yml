version: '3.8'

services:

  maalem-db:
    image: postgres:15
    container_name: maalem_database
    restart: always
    environment:
      # On utilise les variables du fichier .env
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql 

  maalem-backend:
    build:
      context: ./maalem_server
      dockerfile: Dockerfile
    container_name: maalem_api_server
    restart: always
    ports:
      - "8081:8081"
    environment:
      # On utilise les variables du fichier .env
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - maalem-db

volumes:
  postgres_data: